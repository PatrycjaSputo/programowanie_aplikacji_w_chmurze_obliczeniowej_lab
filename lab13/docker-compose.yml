services:
  nginx:
    image: nginx:1.31-alpine
    ports:
      - "4001:80"
    networks:
      - frontend
      - backend
    volumes:
      - ./web:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    image: php:8.2-fpm-alpine
    networks:
      - backend
    volumes:
      - ./web:/var/www/html

  mysql:
    image: mysql:9.7.0
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE_FILE: /run/secrets/db_name
    networks:
      - backend
    volumes:
      - db_data:/var/lib/mysql
    secrets: 
      - db_root_password
      - db_name

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    ports:
      - "6001:80"
    environment:
      PMA_HOST: mysql
    networks:
      - backend
    depends_on:
      - mysql

networks:
  frontend:
  backend:

volumes:
  db_data:

secrets:
  db_root_password:
    file: ./secrets/db_root_password
  db_name:
    file: ./secrets/db_name