services:
  nginx:
    image: nginx:1.31-alpine
    ports:
      - "4001:80"
    networks:
      - frontend
      - backend
    volumes:
      - ./web:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    image: php:8.2-fpm-alpine
    networks:
      - backend
    volumes:
      - ./web:/var/www/html

  mysql:
    image: mysql:9.7.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    networks:
      - backend
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    ports:
      - "6001:80"
    environment:
      PMA_HOST: mysql
    networks:
      - backend
    depends_on:
      - mysql

networks:
  frontend:
  backend:

volumes:
  db_data:
